<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Cute Smiling Tooth with Sparkle -->
    <g id="doodle-tooth">
      <path d="M12 2C8 2 4 4.5 4 8.5C4 11.5 5.5 13.5 6.5 16C7.5 18.5 8 22 10 22C11.5 22 12 19 12 17C12 19 12.5 22 14 22C16 22 16.5 18.5 17.5 16C18.5 13.5 20 11.5 20 8.5C20 4.5 16 2 12 2Z" 
            fill="#FFFFFF" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9.5" cy="8" r="1" fill="currentColor"/>
      <circle cx="14.5" cy="8" r="1" fill="currentColor"/>
      <path d="M9.5 11C10.2 12.2 13.8 12.2 14.5 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="8" cy="10" r="1.2" fill="#FF85A2" opacity="0.85"/>
      <circle cx="16" cy="10" r="1.2" fill="#FF85A2" opacity="0.85"/>
    </g>

    <!-- 4-point Sparkle / Star -->
    <g id="doodle-sparkle">
      <path d="M12 2C12 7.5 7.5 12 2 12C7.5 12 12 16.5 12 22C12 16.5 16.5 12 22 12C16.5 12 12 7.5 12 2Z" 
            fill="currentColor"/>
    </g>

    <!-- Hand-drawn Toothbrush -->
    <g id="doodle-brush">
      <path d="M4 20L15 9C16 8 18 8 19 9L20 10C21 11 21 13 20 14L9 25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M16 8L20 4C21 3 23 3 24 4L25 5C26 6 26 8 25 9L21 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="21" cy="4" r="1" fill="#60A5FA"/>
      <circle cx="24" cy="7" r="1.2" fill="#93C5FD"/>
    </g>

    <!-- Hand-drawn Arrow (Curved Down-Right) -->
    <g id="doodle-arrow-curved">
      <path d="M4 4C12 2 24 8 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M16 20L22 23L24 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Hand-drawn Checkmark -->
    <g id="doodle-check">
      <path d="M4 12L9 17L20 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Wiggle / Squiggly Underline -->
    <g id="doodle-wiggle">
      <path d="M2 8C6 4 10 12 14 8C18 4 22 12 26 8C30 4 34 12 38 8C42 4 46 12 50 8C54 4 58 12 62 8C66 4 70 12 74 8C78 4 82 12 86 8C90 4 94 12 98 8" 
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 5-Star Rating Doodle -->
    <g id="doodle-stars">
      <text x="0" y="16" font-size="18" fill="#F59E0B">★★★★★</text>
    </g>
  </defs>
</svg>
